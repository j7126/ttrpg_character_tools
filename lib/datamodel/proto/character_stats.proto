syntax = "proto3";
package ttrpg_character_tools;

message CharacterStats {
  map<int32, int32> base = 1;
  map<int32, int32> current = 2;
  int32 overrideProficencyBonus = 3;
  StatsMethod method = 4;
  map<int32, int32> savingThrowOverrides = 5;
  repeated StatsType savingThrowProficency = 6;
  repeated StatsType savingThrowProficencyCalculated = 7;
  map<int32, int32> statsOverride = 8;
  repeated CharacterStatsSelection characterStatsSelections = 9;
}

message CharacterStatsSelection {
  string providerRef = 1;
  map<int32, int32> currentMods = 2;
  map<int32, int32> fixedMods = 3;
}

enum StatsType {
  Strength = 0;
  Dexterity = 1;
  Constitution = 2;
  Intelligence = 3;
  Wisdom = 4;
  Charisma = 5;
}

enum StatsMethod {
  StatsStandardArray = 0;
  StatsPointBuy = 1;
  StatsManual = 2;
}
